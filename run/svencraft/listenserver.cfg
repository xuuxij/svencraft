// Svencraft listen server: the engine runs this when a game is hosted from the menu (instead of Sven Co-op's,
// which would make it deathmatch). Co-op: Half-Life's rules with deathmatch off; the engine turns deathmatch on for
// more than one player unless coop is set.
hostname "Svencraft"
coop 1
deathmatch 0
pausable 0
sv_aim 0
sv_allowdownload 1
sv_send_resources 1
sv_voicecodec "voice_speex"
sv_voicequality 5
